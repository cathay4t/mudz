[workspace]
resolver = "2"
members = [
    "src/lib",
    "src/daemon",
]

[workspace.package]
version = "0.1.0"
authors = ["Gris Ge <cnfourt@gmail.com>"]
documentation = "https://github.com/cathay4t/muds"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
data-encoding = "2.6"
env_logger = "0.11.0"
futures-util = "0.3.11"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "http2",
    "ring",
    "tls12",
    "webpki-tokio",
] }
hyper-util = { version = "0.1", features = [
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
libc = "0.2"
log = "0.4.17"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
    "logging",
] }
serde = { version = "1.0.144", features = ["derive"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "tls12",
    "ring",
] }
webpki-roots = "1.0"
toml = "0.8"
tower-service = "0.3"

[workspace.dependencies.tokio]
# 1.51.1 is the minimum: earlier versions do not surface latched socket
# errors (SO_ERROR, e.g. ICMP port-unreachable ECONNREFUSED) from
# UdpSocket::recv on Linux (tokio#8001), which the upstream transport
# relies on to detect dead upstreams.
version = "1.51.1"
features = ["net", "rt", "rt-multi-thread", "macros", "sync", "time", "signal", "io-util"]
