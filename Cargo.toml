[workspace]
resolver = "2"
members = [
    "src/lib",
    "src/daemon",
]

[workspace.package]
version = "0.1.0"
authors = ["Gris Ge <fge@redhat.com>"]
description = "Linux DNS Caching Daemon"
documentation = "https://github.com/cathay4t/muds"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
data-encoding = "2.6"
env_logger = "0.11.0"
futures-util = "0.3.11"
log = "0.4.17"
rand = "0.10"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde = { version = "1.0.144", features = ["derive"] }
toml = "0.8"

[workspace.dependencies.tokio]
version ="1.35.0"
features = ["net", "rt", "rt-multi-thread", "macros", "sync", "time", "signal"]
